<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  >

    name="author"
    content="AbogaIA - Tu Abogado de Cabecera"
  >

  <!-- SEO: NO INDEXAR FORMULARIO DE REGISTRO -->
  <meta name="robots" content="noindex, follow">

  <!-- OPEN GRAPH: FACEBOOK Y WHATSAPP -->

    content="AbogaIA | Crea tu cuenta gratuita"

  >

  >

  <!-- TWITTER / X -->
  <meta name="twitter:card" content="summary">

  <meta
    name="twitter:title"
    content="AbogaIA | Tu Abogado de Cabecera"
  >

  <meta
    name="twitter:description"
    content="Crea tu cuenta gratuita y accede a orientación jurídica inteligente para México."
  >

  <!-- URL CANONICA DEL REGISTRO -->
  <link
    rel="canonical"
    href="https://tu-abogado-de-cabecera.onrender.com/register.html"

  <link

    type="image/png"
    sizes="192x192"
    href="/icon-192.png"
  >

  <!-- CONFIGURACION PWA -->
  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#0f172a">

  <!-- HOJA DE ESTILOS PRINCIPAL -->
  <link rel="stylesheet" href="/style.css">

  <!-- CLOUDFLARE TURNSTILE -->
  <!-- Mantener una sola carga de este script -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer>
  </script>

  <!-- ESTILOS DEL FORMULARIO DE REGISTRO -->
  <style>
    .password-container {
      position: relative;
      width: 100%;
    }

    .password-container input {
      width: 100%;
      padding-right: 40px;
      box-sizing: border-box;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #555;
      user-select: none;
    }

    .checkbox-container {
      text-align: left;
      margin: 10px 0;
      font-size: 14px;
    }

    .checkbox-container input {
      margin-right: 5px;
    }

    .error {
      color: red;
      font-size: 14px;
    }

    .success {
      color: green;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

</head>

<body>

  <div class="container">
    <h2>⚖️ Crear cuenta</h2>

    <!-- Correo -->
    <input type="email" id="email" placeholder="Correo electrónico" required>

    <!-- Contraseña -->
    <div class="password-container">
      <input type="password" id="password" placeholder="Contraseña" required>
      <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
    </div>

    <!-- Confirmar Contraseña -->
    <div class="password-container">
      <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
      <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁️</span>
    </div>

    <!-- Mostrar contraseñas -->
    <div class="checkbox-container">
      <label>
        <input type="checkbox" onclick="toggleAllPasswords()">
        Mostrar contraseñas
      </label>
    </div>

    <!-- CAPTCHA de Cloudflare -->
    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAACpoFVzsoLy-jhC3"">
    </div>

    <br>

    <!-- Botón de registro -->
    <button onclick="register()">Registrarme</button>

    <p id="mensaje"></p>

    <p>
      ¿Ya tienes cuenta?
      <a href="index.html">Inicia sesión</a>
    </p>
  </div>

  <script src="app.js"></script>

  <script>
    /* =========================
       MOSTRAR / OCULTAR CONTRASEÑA
    ========================== */
    function togglePassword(id, icon) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
      } else {
        input.type = "password";
        icon.textContent = "👁️";
      }
    }

    function toggleAllPasswords() {
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");
      const type = password.type === "password" ? "text" : "password";
      password.type = type;
      confirmPassword.type = type;
    }

    /* =========================
       REGISTRO DE USUARIO
    ========================== */
    async function register() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const mensaje = document.getElementById("mensaje");

      mensaje.textContent = "";
      mensaje.className = "";

      // Validaciones
      if (!email || !password || !confirmPassword) {
        mensaje.textContent = "Por favor, completa todos los campos.";
        mensaje.className = "error";
        return;
      }

      if (password !== confirmPassword) {
        mensaje.textContent = "Las contraseñas no coinciden.";
        mensaje.className = "error";
        return;
      }

      if (password.length < 6) {
        mensaje.textContent = "La contraseña debe tener al menos 6 caracteres.";
        mensaje.className = "error";
        return;
      }

      // Obtener token del CAPTCHA
      const captchaToken = document.querySelector(
        "input[name='cf-turnstile-response']"
      )?.value;

      if (!captchaToken) {
        mensaje.textContent = "Por favor, verifica el CAPTCHA.";
        mensaje.className = "error";
        return;
      }

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password,
            captchaToken
          })
        });

        const data = await response.json();

        if (data.success) {
          mensaje.textContent = "Registro exitoso. Redirigiendo al login...";
          mensaje.className = "success";

          setTimeout(() => {
            window.location.href = "index.html";
          }, 2000);
        } else {
          mensaje.textContent = data.error || "Error al registrarse.";
          mensaje.className = "error";
        }
      } catch (error) {
        mensaje.textContent = "Error del servidor.";
        mensaje.className = "error";
      }
    }
  </script>

<p style="font-size:13px; opacity:0.9;">
  La plataforma proporciona orientación legal general y no sustituye asesoría jurídica profesional.
</p>

</body>
</html>
